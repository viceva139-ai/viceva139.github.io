<!DOCTYPE html>
<html>
<head>
<style>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title> Image Effects</title>
        
  body{
  font-family: Arial, sans-serif;
  background: #e9edf0;
  color: #333; }
header {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(135deg, #075477, #1598b8);
  color:white;
  box-shadow:0 5px 12px rgba(0, 0, 0, 0.25); }
header h1{
  margin-bottom: 10px; }

.gallery {
  max-width:1100px;
  margin: 35px auto;
  padding: 15px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap:30px; }
.project {
  background: white;
  padding:18px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
  overflow: hidden; }
.project h2{
  font-size: 18px;
  margin-bottom: 15px;
  color:#075477; }

.penguin-container {
  width: 100%;
  height: 220px;
  border: 2px solid #aab7b8;
  border-radius: 50%;
  overflow: hidden;
  box-shadow:0 5px 15px rgba(0, 0, 0, 0.3); }
.penquin-container img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(15%) contrast(105%);
  border-radius: 50%; }

.football-container {
  width: 100%;
  height: 220px;
  position: relative;
  overflow: hidden;
  border: 5px solid #ddd; }
.footbal-image{
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.65)
  saturate(0.8); }
.tic-tac-toe{
  position: abolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.95;
  pointer-events:one;}

.dinosaur-container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #e0f5ff, #8bd4ef); }
.dinosaur-container img{
  width: 90%;
  height: 90%;
  object-fit:contain;
  filter: saturate(1.3)
          contrast(1.1)
  drop-shadow(5px 8px 5px rgba(0,0,0,0.35)); }

.seagull-container{
  width: 100%;
  height: 220px;
  overflow: hidden;
  background: linear-gradient(to bottom, #64b5e8, #d8f1ff);
  box-shadow: insert 00 15px rgba(0,0,0,0.2); }
.seagull-container img{
  width: 100%;
  height: 100%;
  object-fit:cover;
  filter: brightness(1.08)
  contrast(1.1);
  mix-blend-mode:multiply; }

.butterfly-container {
  width: 100%;
  height: 220px;
  overflow: hidden;
  border-radius: 45%;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.butterfly-container img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 45%;
  filter: saturate(1.3)
  contrast(1.1); }

.stage-container {
  width: 100%;
  height: 220px;
  position: relative;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    linear-gradient( to bottom, #850000, #d10c0c 55%, #5b0000 );
  box-shadow: inset 0 0 25px #300000; }
.curtain{
  position: absolute;
  top: 0;
  width: 22%
  height: 100%;
  background: linear-gradient( to right, #620000,#e32222,#720000);
  box-shadow: 0 0 15px #350000; }
.left-curtain {
  left:0; }
.right-curtain{
  right:0; }
.spotlight {
  position: absolute;
  top: 0;
  left: 25%;
  width: 50%;
  height: 75%;
  background: linear-gradient( to bottom, rgba(255,255,255,0.8),
                              rgba(255,255,255,00);
  clip-path: polygon(35% 0, 65% 0,
                     100% 100%, 0 100%);
  filter: blur(5px); }
.staged-container h3{
  position: relative;
  z-index: 2;
  color: white;
  font-size: 25px;
  text-shadow: 2px 2px 5px black;
  padding: 15px 25px;
  background: rgba(100,0,0,0.35); }

footer{
  text-align: center;
  padding:25px;
  background: #075477;
  color: white; }
@media (max-width: 700px) {
  .gallery{
    grid-template-columns: 1fr; }
  .project{
    width: 100% }
  </style>
    </head>
      <body>
      <header>
        <h1>Image Effects</h1>
      </header>
      <main class="gallery">
     
        <section class="project">
          <h2>1. Penguins</h2>
          <div class="penguin-container">
            <img src="images/penguins.jpg" alt="Penguins">
          </div>
        </section>

        <section class="project">
          <h2>2. Football Field</h2>
          <div class="football-container">
            <img class="football-image"
              src="images/football_field.jpg" alt="Football field">
              <img class="tic-tac-toe"
              src="images/tic-tac-toe.png" alt=" Tic Tac Toe overlay">
          </div>
        </section>

        <section class="project">
          <h2>3. Dinosaur</h2>
          <div class="dinosaur-container">
            <img src="images/dinosaur.png" alt="dinosaur">
          </div>
        </secion>

        <section class="project">
          <h2>4. Seagull</h2>
          <div class="seagull-container">
            <img src="images/seagull.png" alt="Flying seagull">
          </div>
        </section>

        <section class="project">
          <h2>5. Butterfly</h2>
          <div class="butterfly-container">
            <img src="images/butterfly.jpg" alt="butterfly">
          </div>
        </section>

        <section class="project">
          <h2>6. Stage</h2>
          <div class="stage-container">
            <div class="curtain left-curtain"></div>
            <div class ="curtain right-curtain"></div>
            <img src="images/theater_stage.jpg" alt="theather_stage">

            <div class="spotlight"></div>
            <h3>presenting</h3>
          </div>
        </section>
      </main>
</body>
</html>
