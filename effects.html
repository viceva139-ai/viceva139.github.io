<!DOCTYPE html>
<html>
<head>
<style>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title> Image Effects</title>
        
  body{
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px; }
      .gallery-grid {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto; }

      .penguin-container {
            width: 300px;
            height: 200px;
            border-radius: 50%; 
            overflow: hidden;
            border: 1px solid #888;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
      .penguin-container img{
            width: 100%;
            height: 100%;
            object-fit:cover;
            filter: sepia(80%); }

      .football-field {
            width: 280px;
            height: 160px;
            border: 25px solid transparent;
            border-image: url("images/tic-tac-toe.png")
            box-sizing: border-box;
            overflow: hidden; }
      .football-image {
            width: 100%
            height: 100%
            object-fit: cover;
            filter: grayscale(100%); }

      .tic-tact-toe-image {
            display: none; }

      .dino-container {
            width: 300px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff; }
      .dino-container img {
            max-width: 85%;
            max-height: 85%;
            filter: hue-rotate(150deg) drop-shadow(6px 6px 5px rgba(0, 0, 0, 0.5)); }

      .seagull-container {
            width: 300px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #6bb5e8 0%, #d4e8f7 85%, #7a8b74 86%, #5c6b57 100%); }
      .seagull-container img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            filter: drop-shadow(5px 8px 6px rgba(0,0,0,0.4)); }

      .butterfly-container {
            width: 300px;
            height: 200px;
            border-radius: 75px 0 75px 0;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25); }
      .butterfly-container img {
            width: 100%
            height: 100%
            object-fit:cover;
            filter: invert(100%); }

      .stage-container {
            position: relative;
            width: 240px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000; }
      .stage-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0; }
      
      .curtain,
      .spotlight {
            z-index: 1; }
      .stage-container h2,
      .stage-container p,
      .stage-text {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #fff, 0 0 20px #ffdd88; }
            
  </style>
    </head>
      <body>
      <header>
        <h1>Image Effects</h1>
      </header>
      <main class="gallery">
     
        <section class="project">
          <h2>1. Penguins</h2>
          <div class="penguins-container">
            <img src="images/penguins.jpg" alt="Penguins">
          </div>
        </section>

        <section class="project">
          <h2>2. Football Field</h2>
          <div class="football-container">
            <img class="football-image"
              src="images/football_field.jpg" alt="Football field">
              <img class="tic-tac-toe"
              src="images/tic-tac-toe.png" alt=" Tic Tac Toe overlay">
          </div>
        </section>

        <section class="project">
          <h2>3. Dinosaur</h2>
          <div class="dinosaur-container">
            <img src="images/dinosaur.png" alt="dinosaur">
          </div>
        </section>

        <section class="project">
          <h2>4. Seagull</h2>
          <div class="seagull-container">
            <img src="images/seagull.png" alt="Flying seagull">
          </div>
        </section>

        <section class="project">
          <h2>5. Butterfly</h2>
          <div class="butterfly-container">
            <img src="images/butterfly.jpg" alt="butterfly">
          </div>
        </section>

        <section class="project">
          <h2>6. Stage</h2>
          <div class="stage-container">
            <div class="curtain left-curtain"></div>
            <div class ="curtain right-curtain"></div>
            <img src="images/theater_stage.jpg" alt="theater_stage">

            <div class="spotlight"></div>
            <h3>presenting</h3>
          </div>
        </section>
      </main>
</body>
</html>
