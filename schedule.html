<!DOCTYPE html>
<html>
  <head>
    <title>My Busy Day schedule</title>
    <style>
      /*Internal CSS styling*/
      table{
        width:100%
        border-collapse:collapse; }
      th{
        bacground-color:#f2f2f2;
        text-align:left; }
      td{
        border:1px solid #ddd;
        padding:8px; }
      .highlight-row{
        background-color:#e8f4fd
        color:#333; }
    </style>
  </head>
  <body>

    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Event</th>
        </tr>
      </thead>
      <tbody>
        <tr class="highlight-row">
          <td class="time-column">09:00 AM</td> 
          <td>Wake up and shower</td>
        </tr>
        <tr>
          <td class="time-column">10:00 AM</td>
          <td>Prepare and eat breakfast</td>
        </tr>
        <tr>
          <td class="time column">12:00 PM</td>
          <td>Check school work and plan tasks</td>
        </tr>
        <tr>
          <td class="time-column">12:40 PM</td>
          <td>Eat luch</td>
        </tr>
        <tr>
          <td class="time column">02:00 PM</td>
          <td>Do some school work</td>
        </tr>
        <tr>
          <td class="time-column">03:00 PM</td>
          <td>Watch some TV</td>
        </tr>
        <tr>
          <td class="time-column">05:00 PM</td>
          <td>Exercise</td>
        </tr>
        <tr>
          <td class="time-column">07:00 PM</td>
          <td>Eat dinner</td>
        </tr>
      </tbody>
    </table>
    
  </body>
</html>
