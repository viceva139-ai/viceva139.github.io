<!DOCTYPE html>
<html>
  <head>
    <style>
      Body { font-family: sans-serif; Background: #f4f4f9; }

      .fade-in { animation: fadeIn 2s ease-in; text-align: center; }
      @keyframes fadeIn { from { opacity: 0; } to {opacity: 1; } } 

      .card-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        padding: 20px; }

      .card {
        border: 2px solid #333;
        padding: 20px;
        text-align: center;
        background: white;
        height: 100px;
        transition: transform 0.3s; }          

      .answer {opacity: 0; transition: opacity 0.5s ease; color: #d46e37; }
      .card:hover .answer { opacity: 1; }
      .card:hover { transform: scale(1.05); background: #eef; }     
    </style>
    <body>

      <h1 class="fade=in">Flashcards</h1>

      <div class="card-container">
        <div class="card"><p>HTML</p><div class="answer">HyperText Markup lanquage</div></div>
        <div class="card"<p>CSS</p><div class="answer">Cascading Style Sheets</div></div>
        <div class="card"><p>JS</p><div class="answer">JavaScript</div></div>
        <div class="card"><p>DOM</p><div class="answer">Document Object Model</div></div>
        <div class="card"><p>API</p><div class="answer">App Programming Interface</div></div>
        <div class="card"><p>URL</p><div class="answer">Uniform Resource Locator</div></div>
        <div class="card"><p>HTTP</p><div class="answer">HyperText Transfer Protocol</div></div>
        <div class="card"><P>IDE</P><div class="answer">Integrated Dev Environment</div></div>
      </div>
      
    </body>
  </head>
</html>
