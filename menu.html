<!DOCTYPE html>
<html>
  <head>
    <style>
      .menu{
        width: 400px;
        height: 550px;
        margin: 20px;    /* Spacing between menus */
        padding: 20px;    /* Spacing inside the border */
        border: 5px solid black; }
      .breakfast{
        background-image: url('https://images.pexels.com/photos/20342106/pexels-photo-20342106.jpeg'); 
        background-position: center; }
      .lunch {
        background-image: url('https://images.pexels.com/photos/27600334/pexels-photo-27600334.jpeg');
        background-repeat: no-repeat; }
      .dinner{
        background-image: url('https://images.pexels.com/photos/32083436/pexels-photo-32083436.jpeg');
        background-size: cover;}
    </style>
  </head>
  <body>
    <div class="menu breafast">
      <h1>Breakfast</h1>
      <ul>
        <li>Pancakes</li>
        <li>Coffee</li>
      </ul>
    </div>

    <div class="menu lunch">
      <h1>Lunch</h1>
      <ul>
        <li>Sanwich</li>
        <li>Salad</li>
      </ul>
    </div>

    <div class="menu dinner">
      <h1>Dinner</h1>
      <ul>
        <li>Steak</li>
        <li>Wine</li>
      </ul>
  </body>
</html>
